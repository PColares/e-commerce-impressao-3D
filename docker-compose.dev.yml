services:
  # MySQL (e não Postgres) porque é o banco gerenciado do plano da Hostinger —
  # o ambiente local espelha a produção de propósito.
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: camada
      MYSQL_DATABASE: camada
      MYSQL_USER: camada
      MYSQL_PASSWORD: camada
    ports:
      # 3307 no host: a 3306 já está ocupada por outro projeto na máquina
      - "3307:3306"
    volumes:
      - camada-mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-ucamada', '-pcamada']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  camada-mysql-data:
