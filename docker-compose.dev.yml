services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: camada
      POSTGRES_PASSWORD: camada
      POSTGRES_DB: camada
    ports:
      - "5433:5432"
    volumes:
      - camada-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  camada-postgres-data:
